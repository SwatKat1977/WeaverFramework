[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weaver-framework"
dynamic = ["version"]
description = "Weaver Framework"
readme = "README.md"
requires-python = ">=3.13"

authors = [
    { name = "SwatKat1977" }
]

# Minimum versions (never older than these), plus a ceiling at the next major
# version. pip installs the newest allowed release. CI tests both the newest
# and these minimums.
dependencies = [
    "aiohttp>=3.14.3,<4",
    "aiosqlite>=0.22.1",
    "hypercorn>=0.18",
    "quart>=0.23.1",
    "jsonschema>=4.26,<5"
]

classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: Apache Software License",
]

[tool.setuptools.dynamic]
version = {attr = "weaver_framework.__version__"}

[tool.setuptools.packages.find]
where = ["."]
