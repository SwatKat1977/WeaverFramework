name: Validate Branch (lint & unittests)

permissions:
  contents: read

on:
  pull_request:

jobs:
  verify_codebase:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      # Step 1: Checkout code with full history
      - name: Checkout code with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for all branches and tags

      # Step 2: Set up Python (must be in this job - each job runs on a
      # fresh machine, so Python set up in another job is not available here)
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.dev

      # Step 4: Run Pylint
      - name: Run Pylint
        env:
          PYTHONPATH: .
        run: |
          python -m pylint --fail-under=10.0 weaver_framework/*

      # Step 5: Run tests and measure coverage
      - name: Run tests with coverage
        run: |
          coverage run -m unittest -v tests/main.py
          coverage report -m --fail-under=100